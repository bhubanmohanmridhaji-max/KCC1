<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KCC Menu – Outlet Sign-off</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--tx:#222;--mut:#666;--ac:#b5453f;--bd:#d9d2c7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b19;--card:#2a2723;--tx:#eee;--mut:#aaa;--ac:#e0746d;--bd:#4a443d;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Arial,sans-serif}
.app{max-width:1000px;margin:auto;padding:12px}
h1{font-size:20px;margin:6px 0 10px;color:var(--ac)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:7px;max-width:100%}
textarea{width:100%;box-sizing:border-box;resize:vertical;min-height:64px}
button{font:inherit;border:0;border-radius:6px;padding:8px 12px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.day{font-weight:700;padding:8px 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-top:12px}
.card h2{font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card h2 small{color:var(--mut);font-weight:400}
.grid{display:grid;grid-template-columns:1fr 1fr 260px;gap:10px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
canvas{border:1px dashed var(--mut);border-radius:6px;background:#fff;width:100%;height:100px;touch-action:none;display:block}
.row{display:flex;gap:6px;margin-top:6px;align-items:center}
.row input{flex:1;min-width:0}
#sheet{display:none}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body{background:#fff;color:#000}
 .app{display:none}
 #sheet{display:block;color:#000;font-size:12px}
 #sheet h3{margin:0 0 6px;font-size:15px}
 #sheet .meta{display:flex;justify-content:space-between;border:1px solid #000;padding:5px 8px;margin-bottom:6px;font-weight:700}
 #sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
 #sheet th,#sheet td{border:1px solid #000;padding:5px;vertical-align:top;white-space:pre-wrap;word-wrap:break-word}
 #sheet th{background:#eee}
 #sheet td.sg img{max-width:100%;max-height:70px;display:block}
 #sheet tr{page-break-inside:avoid}
 #sheet .one td{height:120mm}
}
</style></head><body>
<div class="app">
<h1>KCC Menu – Outlet Sign-off</h1>
<div class="bar">
 <label>Outlet<input id="outlet" list="ol" placeholder="Outlet name"></label>
 <datalist id="ol"><option value="KCC"><option value="HIS"><option value="HARI"><option value="Parivar Cafe"><option value="Bakery Counter"></datalist>
 <label>Date<input type="date" id="date"></label>
 <button id="pall">🖨 Print date-wise (all sessions)</button>
 <button class="g" id="reset">Reset day to standard menu</button>
 <span id="st" style="font-size:12px;color:var(--mut)">Auto-saved in this browser</span>
 <button class="g" id="rep">📋 Saved Log / Date-wise Report</button>
</div>
<div class="day" id="dayl"></div>
<div id="rp" class="card" style="display:none"><h2><span>Saved Log – Date-wise Report</span></h2>
<div class="row" style="flex-wrap:wrap"><label>From<input type="date" id="rf"></label><label>To<input type="date" id="rt"></label><label>Outlet<select id="ro" style="padding:7px;border-radius:6px"></select></label><button id="rs">Show</button><button id="rpr">🖨 Print report</button><button class="g" id="rcsv">Export CSV</button></div>
<div id="rt2" style="overflow-x:auto;margin-top:10px"></div></div>
<div id="cards"></div>
</div>
<div id="sheet"></div>
<script>
const S=[["bf","Breakfast","8am to 8.30am"],["ms","Morning Snacks",""],["ln","Lunch","12:30pm to 2:30pm"],["sn","Snacks","5pm to 5:30pm"],["dn","Dinner","7.30 to 9.00"]];
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const M={
1:{bf:"Idly & Wada, Allam Chutney, Sambar, Palli Coffee/Milk",ms:"Fruit + Roasted Chana",ln:"Rice, Roti, Bhendi Fry, Thotakura Pappu, Sorakai Chutney, Curd & Papad, Pacchipulusu, PODINA RICE or pakoda kadhi, Onion Slice (3kg)",sn:"Punugulu, Tomato Chutney, VANILA MIKSHAKE for Staff (Tea-50nos)",dn:"Rice, roti, Chamagadda Fry, Brinjal Tomato Curry, *Sambar, Curd, Gongura Pickle, Sweet Pongal or PIZZA FRENCH FRIES, MIONESE, chilli flakes"},
2:{bf:"Masala Dosa, Palli Chutney, Sambar or Puri aloo/Chole Curry, Tea/Milk",ms:"Banana & Murukula or Oat Cookies (4nos)",ln:"White Rice, Roti, Vankaya Masala Curry, Palakura Pappu, Rasam, Gongura Chutney, Curd, Veg Pulao or Paneer biryani, Ratitha",sn:"Onion Pakoda for Staff (Tea-50nos), Watermelon Juice",dn:"Rice, Chapati, Tomato Curry or Shimla Mirchi Meal Maker Fry, Sambar with Drum Sticks, Tomato Pickle, Curd"},
3:{bf:"Coffee/Milk, ALOO PARATHA, CURD BUTTER, LEMON PICKLE",ms:"Seasonal Fruit & Peanut Chikki",ln:"Rice, Roti, Dondakai Fry, Gongura Pappu, Beerakaya Chutney, Curd & Papad, Sambar, Onion Slice (3kg)",sn:"*Masala Vada (Big Size 2 Piece) or Mirchi Bajji, Mosambi Juice, for Staff (Tea-50nos)",dn:"Rice, Roti, Rasam, Aloo Kurma, Mango Pickle, Semiya Payasam, CURD, VEG BIRYANI"},
4:{bf:"Uttapam, Allam Chutney, Sambar, palli Chutney, Tea/milk",ms:"Seasonal Fruit & Banana Chips",ln:"White Rice, Roti, Pulihora rice, Dosakaya Pappu, Drum Stick Curry, Curd, Mango Pickle",sn:"Grilled Sandwich or Pastry, STRAWBERY Lassi, for Staff (Tea-50nos)",dn:"Fried Rice / NOODLES, gobi MANCHURIA, rice, Dal, curd"},
5:{bf:"Pongal, Vada, Palli Chutney, Sambar, Coffee/Milk",ms:"Cup Cake & Masala Chips",ln:"White Rice, Roti, Birakaya Pachi Changa Pappu Curry, Tomato Pappu, Pudina Chutney, Curd & Papad, Rasam",sn:"Bhattani Chat (100 g), LEMONADE, for Staff (Tea-50nos)",dn:"Rice, Sambar, Perugu Charu, Mushroom Masala, Flav Rice, Curd, Tomato Pickle, Rasagulla"},
6:{bf:"Pesarattu + Upma, Tomato Chutney, Palli Chutney, Sambar or Bambino and cereal, Tea/Milk",ms:"Seasonal Fruit & Friut Cake",ln:"White Rice, Roti, Tomato Rice, Crispy Soya Fry, Bendi Pulusu, Mentikura Pappu, Papad, Curd, Onion Slice (3kg)",sn:"Samosa (150 g), Fresh juice, for Staff (Tea-50nos)",dn:"Rice, Chapati, Rasam, bhindi do pyaza, Cabbage GS or Onion Pakodi, Rasam, Curd, Mango Pickle"},
0:{bf:"Jumbo Poori Chole or MASALA DOSA, Palli Chutney, Tea/Milk, MILK, BREAD (50%), JAM, BUTTER",ms:"Chocolate Coated biscuit (2nos) & Seasonal Fruit",ln:"Rice, Roti, Beetroot Bhaji or Goruchikkudu Pakodi Curry, Sambar, Vankai tomato Curry or Rajma/Chole, Curd, Coconut Chutney",sn:"Veg Spring roll, Sweet Lassi or COLD BADAM MILK, for Staff (Tea-50nos)",dn:"Basmathi Veg Biryani, Paneer Butter Masala, Raita, Sweet (Gulab Jamun/laddu/Kalakand), Onion Slice with Lemon, Rumali roti or Roti"}};
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dow=ds=>new Date(ds+"T00:00:00").getDay();
const fmt=ds=>ds.split("-").reverse().join("/");
let data={};
const key=()=>"kcc:"+$("date").value+"|"+$("outlet").value.trim().toLowerCase();
function load(){try{data=JSON.parse(localStorage.getItem(key()))||{}}catch(e){data={}}}
function save(){try{localStorage.setItem(key(),JSON.stringify(data));$("st").textContent="Saved ✓ "+new Date().toLocaleTimeString()}catch(e){$("st").textContent="⚠ Could not save (storage blocked)"}}
function cur(k){const d=dow($("date").value);return data[k]||{items:M[d][k],changed:"",name:"",sig:""}}
function build(){
 $("dayl").textContent=DAYS[dow($("date").value)]+" – "+fmt($("date").value);
 load();const c=$("cards");c.innerHTML="";
 S.forEach(([k,t,tm])=>{
  const v=cur(k);const el=document.createElement("div");el.className="card";
  el.innerHTML=`<h2><span>${t} <small>${tm}</small></span><button class="g" data-p="${k}">🖨 Print ${t}</button></h2>
  <div class="grid"><label>${t} items (editable)<textarea data-f="items">${esc(v.items)}</textarea></label>
  <label>Any item changed<textarea data-f="changed" placeholder="Write changes, or leave blank">${esc(v.changed)}</textarea></label>
  <div><label>Signature (draw with finger / mouse)</label><canvas></canvas>
  <div class="row"><input data-f="name" placeholder="Signed by (name)" value="${esc(v.name)}"><button class="g" data-c="1">Clear</button></div></div></div>`;
  c.appendChild(el);
  el.querySelectorAll("[data-f]").forEach(i=>i.oninput=()=>{upd(k,i.dataset.f,i.value)});
  el.querySelector("[data-p]").onclick=()=>doPrint([k]);
  pad(el.querySelector("canvas"),k,v.sig,el.querySelector("[data-c]"));
 });
}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function upd(k,f,val){const v=cur(k);v[f]=val;data[k]=v;save()}
function pad(cv,k,sig,clr){
 const r=window.devicePixelRatio||1;const w=cv.clientWidth||260;cv.width=w*r;cv.height=100*r;
 const x=cv.getContext("2d");x.scale(r,r);x.lineWidth=2;x.lineCap="round";x.strokeStyle="#000";
 if(sig){const im=new Image();im.onload=()=>x.drawImage(im,0,0,w,100);im.src=sig}
 let dr=false;
 const p=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 cv.onpointerdown=e=>{dr=true;cv.setPointerCapture(e.pointerId);const[a,b]=p(e);x.beginPath();x.moveTo(a,b)};
 cv.onpointermove=e=>{if(!dr)return;const[a,b]=p(e);x.lineTo(a,b);x.stroke()};
 const end=()=>{if(!dr)return;dr=false;upd(k,"sig",cv.toDataURL("image/png"))};
 cv.onpointerup=end;cv.onpointercancel=end;
 clr.onclick=()=>{x.clearRect(0,0,w,100);upd(k,"sig","")};
}
function doPrint(keys){
 const d=$("date").value,o=$("outlet").value||"________";
 const rows=keys.map(k=>{const s=S.find(a=>a[0]===k),v=cur(k);
  return `<tr class="${keys.length==1?"one":""}"><td><b>${s[1]}</b><br>${s[2]}</td><td>${esc(v.items)}</td><td>${esc(v.changed)}</td><td class="sg">${v.sig?`<img src="${v.sig}">`:""}${esc(v.name)}</td></tr>`}).join("");
 $("sheet").innerHTML=`<h3>KCC MENU – ${keys.length==1?S.find(a=>a[0]===keys[0])[1]+" Sign-off":"Daily Sign-off"}</h3>
 <div class="meta"><span>Outlet: ${esc(o)}</span><span>Date: ${fmt(d)} (${DAYS[dow(d)]})</span></div>
 <table><colgroup><col style="width:12%"><col style="width:38%"><col style="width:28%"><col style="width:22%"></colgroup>
 <tr><th>Session</th><th>Menu items</th><th>Any item changed</th><th>Signature</th></tr>${rows}</table>`;
 setTimeout(()=>window.print(),100);
}
function allLog(){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||k.indexOf("kcc:")!==0)continue;const m=k.slice(4).split("|");if(!/^\d{4}-\d\d-\d\d$/.test(m[0]))continue;let d;try{d=JSON.parse(localStorage.getItem(k))}catch(e){continue}
 S.forEach(([sk,t])=>{const v=d&&d[sk];if(v)out.push({date:m[0],outlet:(m[1]||"").toUpperCase(),ses:t,items:v.items||"",changed:v.changed||"",name:v.name||"",signed:!!v.sig})})}}catch(e){}
 return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.outlet.localeCompare(b.outlet))}
function repRows(){const f=$("rf").value,t=$("rt").value,o=$("ro").value;return allLog().filter(r=>(!f||r.date>=f)&&(!t||r.date<=t)&&(!o||r.outlet===o))}
function showRep(){const rows=repRows();
 $("rt2").innerHTML=rows.length?`<table style="width:100%;border-collapse:collapse;font-size:13px"><tr>${["Date","Outlet","Session","Items changed","Signature"].map(h=>`<th style="border:1px solid var(--bd);padding:5px;text-align:left">${h}</th>`).join("")}</tr>`+rows.map(r=>`<tr>${[fmt(r.date)+" ("+DAYS[dow(r.date)].slice(0,3)+")",r.outlet,r.ses,r.changed||"\u2013",r.signed?"\u2714 Signed"+(r.name?" – "+r.name:""):"\u2716 Not signed"].map(c=>`<td style="border:1px solid var(--bd);padding:5px;vertical-align:top">${esc(c)}</td>`).join("")}</tr>`).join("")+"</table>":"<p>No saved entries for this filter.</p>"}
function openRep(){const p=$("rp");if(p.style.display==="block"){p.style.display="none";return}
 const all=allLog(),os=[...new Set(all.map(r=>r.outlet))];$("ro").innerHTML="<option value=\"\">All outlets</option>"+os.map(o=>`<option>${esc(o)}</option>`).join("");
 $("rf").value=today().slice(0,8)+"01";$("rt").value=today();p.style.display="block";showRep()}
$("rep").onclick=openRep;$("rs").onclick=showRep;
$("rpr").onclick=()=>{const rows=repRows();
 $("sheet").innerHTML=`<h3>KCC MENU – Date-wise Saved Log Report</h3><div class="meta"><span>Outlet: ${esc($("ro").value||"All")}</span><span>Period: ${$("rf").value?fmt($("rf").value):"-"} to ${$("rt").value?fmt($("rt").value):"-"}</span></div>
 <table><colgroup><col style="width:14%"><col style="width:12%"><col style="width:14%"><col style="width:40%"><col style="width:20%"></colgroup><tr><th>Date</th><th>Outlet</th><th>Session</th><th>Items changed</th><th>Signature</th></tr>`+
 rows.map(r=>`<tr><td>${fmt(r.date)}<br>${DAYS[dow(r.date)]}</td><td>${esc(r.outlet)}</td><td>${r.ses}</td><td>${esc(r.changed)||"-"}</td><td>${r.signed?"Signed"+(r.name?"<br>"+esc(r.name):""):"Not signed"}</td></tr>`).join("")+`</table>`;
 setTimeout(()=>window.print(),100)};
$("rcsv").onclick=()=>{const q=s=>'"'+String(s).replace(/"/g,'""')+'"';const l=["Date,Day,Outlet,Session,Items,Items changed,Signed,Signed by"].concat(repRows().map(r=>[r.date,DAYS[dow(r.date)],r.outlet,r.ses,r.items,r.changed,r.signed?"Yes":"No",r.name].map(q).join(",")));
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([l.join("\n")],{type:"text/csv"}));a.download="KCC_menu_log.csv";a.click()};
$("date").value=today();
try{$("outlet").value=localStorage.getItem("kcc:lastOutlet")||"KCC"}catch(e){$("outlet").value="KCC"}
$("date").onchange=build;
$("outlet").onchange=()=>{try{localStorage.setItem("kcc:lastOutlet",$("outlet").value)}catch(e){}build()};
$("pall").onclick=()=>doPrint(S.map(s=>s[0]));
$("reset").onclick=()=>{if(confirm("Reset all sessions for this date & outlet?")){data={};try{localStorage.removeItem(key())}catch(e){}build()}};
build();
</script></body></html>
